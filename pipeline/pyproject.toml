[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ceatw-update-pipeline"
version = "0.0.1"
authors = [
  { name="George Li", email="gl579@cam.ac.uk" },
  { name="Laurie Gale", email="lpg28@cl.cam.ac.uk"}
]
description = "An AI pipeline for automatically finding sources for the CEATW project."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
"beautifulsoup4==4.15.0",
"exa_py==2.16.0",
"google-genai==2.12.0",
"playwright==1.61.0",
"protobuf==7.35.1",
"pytest==9.1.1",
"python-dotenv==1.2.2",
"Requests==2.34.2",
"validators==0.35.0",
"pydantic==2.13.4",
"pydantic_settings==2.14.2",
"SQLAlchemy==2.0.51",
"asyncpg==0.31.0",
"uuid_utils==0.17.0"
]

# Mypy refuses to work with this.
[tool.mypy]
strict = true
plugins = [
  "pydantic.mypy"
]

exclude = [
    '^venv/',
    '^.venv/',
    '^env/',
    '^tests/'
]